<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <title>Title</title>
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                font-family: "Segoe UI", sans-serif;
            }
            input,
            textarea,
            select,
            option {
                font-family: "Segoe UI", sans-serif;
                font-size: 1rem;
                padding: 3px 8px;
            }
            form {
                width: 100%;
                max-width: 600px;
                margin: auto;
                background: #f5f5f5;
                padding: 30px;
                border: #eee solid 1px;
            }
            input,
            textarea,
            select {
                width: 100%;
                margin-bottom: 15px;
            }
            input[type="submit"] {
                width: auto;
                border: none;
                background-color: forestgreen;
                color: white;
                font-weight: bold;
                font-size: 1.1rem;
                padding: 6px 15px;
            }
            input[type="checkbox"],
            input[type="radio"] {
                width: auto;
                margin-bottom: 0;
            }
            input[type="checkbox"] {
                margin-top: 15px;
            }
            input[type="submit"]:hover {
                background-color: #29a629;
                box-shadow: 0 3px 4px grey;
            }
            #boton {
                text-align: center;
            }
            .fila {
                display: flex;
                align-items: end;
                gap: 30px;
            }
            .columna {
                width: 100%;
            }
            .columna11 {
                width: 80%;
            }
            .columna12 {
                width: 20%;
            }
            .columna21 {
                width: 20%;
            }
            .columna22 {
                width: 40%;
            }
            .columna23 {
                width: 40%;
            }
        </style>
    </head>
