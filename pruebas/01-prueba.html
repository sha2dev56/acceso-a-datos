<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Primera prueba</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font: 1rem "Cambria";
        color: #5d00ff;
      }
      h1 {
        font-family: "Calibri";
        font-size: 3rem;
        color: #ff0202;
      }
      #foto {
        width: 400px;
        height: 400px;
        object-fit: cover;
      }
      .fila {
        display: flex;
        gap: 40px;
      }
      .columna {
        width: 400px;
        height: 400px;
        background: rgb(248, 0, 211);
      }
      form {
        padding: 20px;
      }
      input,
      textarea {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <h1>Lucas Hernandez Romero</h1>
    <p>18/09/2026</p>
    <p>Madrid</p>
    <a href="https://www.udit.es/" target="_blank">Universidad de diseño de inovacion y tecnologia</a> <br />
    <a href="https://es.wikipedia.org/wiki/Benjam%C3%ADn_Netanyahu#" target="_blank">Neymar</a> <br />
    <div class="fila">
      <div class="columna">
        <form action="http://www.cursos-diseño.es/mostrar.php" method="get">
          nombre:
          <input type="text" name="nombre" id="nombre" /> <br />

          email:
          <input type="email" name="correo" id="email" /> <br />

          comentario:
          <textarea name="comentario" id="comentario" cols="30" rows="10"></textarea> <br />

          <input type="submit" value="enviar" />
        </form>
      </div>
      <div class="columna">
        <img src="perrito.jpg" id="foto" />
      </div>
    </div>
  </body>
</html>
