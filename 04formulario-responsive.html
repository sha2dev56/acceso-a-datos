<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style04.css">
    
    <title>Formulario Responsive</title>
</head>

<body>
    <header>
        <h1>Formulario Responsive</h1>
    </header>
    <article>
        <form action="http://www.cursos-diseño.es/mostrar.php" method="post"></form>
        Nombre
        <input type="text" name="nombre">
        Email
        <input type="email" name="email">
        Teléfono
        <input type="text" name="telefono">
        Tipo de habitación
        <tr>
            <td>
                <select name="habitacion">
                    <option values="i1">Individual</option>
                    <option values="d2">Doble 2 camas</option>
                    <option values="di">Doble matrimonio</option>
                    <option values="t3">Triple 3 camas</option>
                    <option values="t2">Triple matrimonio individual</option>
                </select>
            </td>
        </tr>

    </article>
</body>

</html>
