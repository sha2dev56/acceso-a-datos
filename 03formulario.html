<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style03.css">

    <title>Formulario</title>
</head>

<body>
    <header>
        <h1>Formulario Usuarios</h1>

    </header>
    <article>
        <h2>Formulario de búsqueda</h2>
        <form action="http://google.es/search" method="get">

            <input type="text" name="q">
            <input type="hidden" name="udm" value="2">

            <input type="submit" value="buscar">
            <input type="image" src="img/lupa (1).png">
        </form>
        <br>

        <hr>

        <h2>Tipos de inputs y propiedades</h2>
        <form action="https://www.cursos-diseño.es/mostrar.php" method="post" autocomplete="off">

            <table>
                <tr>
                    <td> Apellidos*</td>
                    <td><input type="text" name="apellidos" class="grande" required autofocus> </td>
                    <!-- autfocus para que aparezca el teclado directamente al recargar o entrar en la pagina, REQUIRED: campo obligatorio-->
                </tr>

                <tr>
                    <td> Código Postal </td>
                    <td><input type="text" name="cp" maxlength="5" minlength="5" class="pequenio"> </td>
                </tr>

                <tr>
                    <td> Teléfono </td>
                    <td> <input type="text" name="telefono" placeholder="+34 123 456 789" class="mediano"> </td>
                </tr>
                <tr>
                    <td>Ciudad</td>
                    <td><input type="text" name="ciudad" value="Madrid" class="mediano"> </td>
                </tr>
                <tr>
                    <td>Contraseña</td>
                    <td><input type="password" name="clave" class="pequenio" id="clave">
                        <input type="button" value="ver">

                    </td>
                </tr>
                <tr>
                    <td>Email*</td>
                    <td><input type="email" name="email" class="mediano" autocomplete="off" required></td>
                </tr>
                <tr>
                    <td>Comentario</td>
                    <td> <textarea name="Comentario" class="grande" rows="5"></textarea></td>
                    <!-- rows se usa para indicar cuantos reglos se van a mosotrar, si se escribe mas, aparece una barra de scroll-->
                </tr>
                <tr>
                    <td>Edad</td>
                    <td><input type="number" name="edad" class="pequenio" value="25" min="18" max="65"></td>
                </tr>
                <tr>
                    <td>Latas</td>
                    <td><input type="number" name="latas" min="6" value="12" step="6"> </td>
                    <!-- step es el intervalo de salto-->
                </tr>
                <tr>
                    <td>Ingredientes</td>
                    <td>
                        <label>
                            <input type="checkbox" name="tomate" value="si">
                            Tomate
                        </label><br>
                        <label>
                            <input type="checkbox" name="pepino" value="si">
                            Pepino
                        </label> <br>
                        <label>
                            <input type="checkbox" name="cebolla" value="si">
                            Cebolla
                        </label> <br>
                        <label>
                            <input type="checkbox" name="garbanzos" value="si">
                            Garbanzos
                        </label> <br>
                    </td>
                </tr>
                <tr>
                    <td>Horario</td>
                    <td>
                        <label><input type="radio" name="horario" value="maniana"> Mañana </label> <br>
                        <label><input type="radio" name="horario" value="tarde"> Tarde </label> <br>
                        <label><input type="radio" name="horario" value="noche"> Noche </label> <br>
                        <label></label><input type="radio" name="horario" value="indiferente" checked> Indiferente
                        </label> <!-- checked se usar para tene predeterminada una opcion-->
                    </td>
                </tr>
                <tr>
                    <td>Habitación</td>
                    <td>
                        <select name="habitacion">
                            <option values="i1">Individual</option>
                            <option values="d2">Doble 2 camas</option>
                            <option values="di">Doble matrimonio</option>
                            <option values="t3">Triple 3 camas</option>
                            <option values="t2">Triple matrimonio individual</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Provincias</td>
                    <td>
                        <select name="provincia" id="provincia" required>
                            <option value=""> Selecciona una provincia</option>
                            <option value="04">Almería</option>
                            <option value="01">Álava</option>
                            <option value="02">Albacete</option>
                            <option value="03">Alicante</option>
                            <option value="33">Asturias</option>
                            <option value="05">Ávila</option>
                            <option value="06">Badajoz</option>
                            <option value="07">Baleares</option>
                            <option value="08">Barcelona</option>
                            <option value="48">Bizkaia</option>
                            <option value="09">Burgos</option>
                            <option value="10">Cáceres</option>
                            <option value="11">Cádiz</option>
                            <option value="39">Cantabria</option>
                            <option value="12">Castellón</option>
                            <option value="13">Ciudad Real</option>
                            <option value="14">Córdoba</option>
                            <option value="15">A Coruña</option>
                            <option value="16">Cuenca</option>
                            <option value="20">Gipuzkoa</option>
                            <option value="17">Girona</option>
                            <option value="18">Granada</option>
                            <option value="19">Guadalajara</option>
                            <option value="21">Huelva</option>
                            <option value="22">Huesca</option>
                            <option value="23">Jaén</option>
                            <option value="24">León</option>
                            <option value="25">Lleida</option>
                            <option value="27">Lugo</option>
                            <option value="28">Madrid</option>
                            <option value="29">Málaga</option>
                            <option value="30">Murcia</option>
                            <option value="31">Navarra</option>
                            <option value="32">Ourense</option>
                            <option value="34">Palencia</option>
                            <option value="35">Las Palmas</option>
                            <option value="36">Pontevedra</option>
                            <option value="26">La Rioja</option>
                            <option value="37">Salamanca</option>
                            <option value="38">Santa Cruz de Tenerife</option>
                            <option value="40">Segovia</option>
                            <option value="41">Sevilla</option>
                            <option value="42">Soria</option>
                            <option value="43">Tarragona</option>
                            <option value="44">Teruel</option>
                            <option value="45">Toledo</option>
                            <option value="46">Valencia</option>
                            <option value="47">Valladolid</option>
                            <option value="49">Zamora</option>
                            <option value="50">Zaragoza</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Foto</td>
                    <td>
                        <input type="file" name="foto" accept="image/*">
                    </td>
                </tr>
                <tr>
                    <td>Fecha</td>
                    <td>
                        <input type="date" name="fecha" value="2026-12-30" min="2026-11-11" max="2027-01-20" step="7">
                        <!--se envia luego con formato ISO YYYY-MM-DD, VALUE para darle un dato predeterminado, STEP se usa para los saltos-->
                    </td>
                </tr>
                <tr>
                    <td>Hora</td>
                    <td><input type="time" name="hora" min="12:15" max="17:45" value="14:00" step="900"></td>
                </tr>
                <tr>
                    <td><label>
                            <input type="checkbox" name="acepto" value="">
                        </label></td>
                    <td>Acepto los términos y condiciones</td>

                </tr>
                <tr>
                    <td></td>
                    <td><input type="hidden" name="origen" value="Pagina del formulario"></td>
                </tr>
                <tr>
                    <td><input type="submit" value="Comprobar"></td> <br>
                </tr>




        </form>
    </article>

</body>

</html>
